<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="styles.css" />

  <title>Contact Me - Nizar</title>
</head>

<body class="bg-black text-white">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="./index.html">
        Nizar
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div
        class="collapse navbar-collapse justify-content-end"
        id="navbarNav"
      >
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="./projects.html">
              Projects
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="./contact.html">
              Contact Me
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Contact Section -->
  <main class="container pt-5 mt-5">

    <div class="text-center mb-5">
      <h1 class="display-2 spider-title d-inline-block position-relative mb-2" data-text="CONTACT ME">
        CONTACT ME
      </h1>

      <p class="text-secondary fs-5">
        Feel free to reach out for collaborations or project inquiries
      </p>
    </div>

    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">

        <div
          class="p-4 rounded-4 text-white border border-secondary border-opacity-25 shadow-sm"
          style="background-color: #121215"
        >

          <form>

            <div class="mb-3">
              <label class="form-label fw-semibold">
                Name :
              </label>

              <input
                type="text"
                name="fullname"
                class="form-control bg-dark text-white border-secondary rounded-3"
                placeholder="Full Name"
                required
              />
            </div>


            <div class="mb-3">
              <label class="form-label fw-semibold">
                Email :
              </label>

              <input
                type="email"
                name="email"
                class="form-control bg-dark text-white border-secondary rounded-3"
                placeholder="Your email"
                required
              />
            </div>


            <div class="mb-3">
              <label class="form-label fw-semibold">
                Address :
              </label>

              <input
                type="text"
                name="address"
                class="form-control bg-dark text-white border-secondary rounded-3"
                placeholder="Address"
              />
            </div>


            <div class="mb-3">
              <label class="form-label fw-semibold">
                Phone Number :
              </label>

              <input
                class="form-control bg-dark text-white border-secondary rounded-3"
                type="tel"
                name="phone"
                inputmode="numeric"
                placeholder="Enter 10-digit number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
              />
            </div>


            <button
              type="submit"
              class="btn btn-danger w-100 fw-bold rounded-3 py-2 mt-2"
            >
              Submit Message
            </button>

          </form>

        </div>

        <!-- Social / Direct Contact Links -->
        <div class="text-center mt-4">
          <a href="https://github.com/nizaaaa6" target="_blank" rel="noopener" class="btn btn-outline-light px-4 py-2 rounded-3">
            <i class="bi bi-github me-1"></i> Visit GitHub Profile
          </a>
        </div>

      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center text-secondary py-5 mt-5">
    <div class="container">
      <p class="mb-0">
        © 2026 Nizar. All Rights Reserved.
      </p>
    </div>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>

</html>
